<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi organismo — Naowee Organismos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../shared/tokens.css?v=1.7.1">
<link rel="stylesheet" href="../../shared/shell.css?v=1.7.1">
<link rel="stylesheet" href="../../shared/components.css?v=1.7.1">
<link rel="stylesheet" href="../../shared/forms.css?v=1.7.1">
<link rel="stylesheet" href="../../shared/detalle.css?v=1.7.1">
<link rel="stylesheet" href="../../shared/naowee-footer.css?v=1.7.1">

<style>
/* ═══════════════════════════════════════════════════════════════
   Variante B · Ciclo del organismo
   1) «Mi organismo»: página propia del administrador cuando su organismo no
      está Activo. Arriba la tarea (qué te toca), luego el recorrido del ciclo
      como guía y la trazabilidad debajo. La ficha completa queda a un clic.
   2) Ficha del organismo (Ministerio): panel «Estado y sanciones» junto a la
      ficha, con Suspender / Cancelar / Reactivar y el historial de sanciones.
   Solo tokens del módulo y clases existentes (.od-*, .bj-*, .reg-modal,
   .naowee-*). Lo nuevo es layout page-scoped: .mo-* y .ss-*.
   ═══════════════════════════════════════════════════════════════ */

/* ── Foco de teclado visible en el shell ── */
.user-chip:focus-visible, .header-burger:focus-visible, .burger-btn:focus-visible, .nav-row:focus-visible {
  outline: none; box-shadow: 0 0 0 3px rgba(215, 64, 9, .22);
}
.naowee-tab:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.naowee-breadcrumb__item:focus-visible, .mo-link:focus-visible { outline: none; border-radius: 4px; box-shadow: 0 0 0 3px rgba(215, 64, 9, .22); }
.reg-modal__close:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(215, 64, 9, .22); }

/* ═══ 1 · Mi organismo ═══ */
.mo-org { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; }
.mo-org__emoji {
  width: 44px; height: 44px; flex-shrink: 0; border-radius: var(--radius-lg); background: var(--bg-soft);
  display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1;
}
.mo-org__name { font-size: clamp(22px, 2.4vw, 26px); font-weight: 800; letter-spacing: -.6px; color: var(--azul); margin: 0; line-height: 1.15; }
.mo-org__meta { font-size: 13px; color: var(--text-secondary); margin: 4px 0 0; }

.mo-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.mo-col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* Tarjeta de la tarea */
.mo-task { padding: 24px; animation: stubIn .4s var(--easing-smoothout) both; }
.mo-task__top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.mo-task__since { font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.mo-task__title { font-size: 20px; font-weight: 800; letter-spacing: -.3px; color: var(--text-primary); margin: 0 0 6px; line-height: 1.25; }
.mo-task__text { font-size: 14px; color: var(--text-secondary); line-height: 1.55; margin: 0; max-width: 620px; }
.mo-task__text strong { color: var(--text-primary); font-weight: 600; }
.mo-task__actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.mo-task__actions .naowee-btn svg { width: 16px; height: 16px; }
.mo-task .naowee-message { margin-top: 18px; }

/* Motivo de la decisión (devolución / rechazo / sanción) */
.mo-reason { margin-top: 18px; padding: 14px 16px; background: var(--bg-soft); border-radius: var(--radius-lg); }
.mo-reason__label { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin: 0 0 4px; }
.mo-reason__text { font-size: 15px; font-weight: 600; color: var(--text-primary); margin: 0; line-height: 1.45; }
.mo-reason__note { font-size: 13.5px; color: var(--text-primary); margin: 6px 0 0; line-height: 1.5; }
.mo-reason__by { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.45; }
.mo-reason__by > span:last-child { min-width: 0; padding-top: 3px; }
.mo-reason__by strong { color: var(--text-primary); font-weight: 600; }
.mo-reason__ava {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; font-size: 10.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; background: var(--purple-bg); color: var(--purple);
}
.mo-reason__ava--min { background: var(--blue-bg); color: var(--azul); }

/* Recorrido del ciclo */
.mo-cycle { padding: 22px 24px; }
.mo-h { font-size: 15px; font-weight: 700; color: var(--text-primary); margin: 0 0 16px; }
.mo-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.mo-step { position: relative; padding: 0 12px 0 0; min-width: 0; }
.mo-step__mark {
  position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
  background: #fff; border: 2px solid var(--border-dark); color: var(--text-muted); font-variant-numeric: tabular-nums;
}
.mo-step__mark svg { width: 14px; height: 14px; }
/* Conector entre pasos */
.mo-step:not(:last-child)::after {
  content: ''; position: absolute; top: 13px; left: 36px; right: 8px; height: 2px; border-radius: 2px; background: var(--border);
}
.mo-step.is-done:not(:last-child)::after { background: var(--green-border); }
.mo-step__name { font-size: 13.5px; font-weight: 700; color: var(--text-primary); margin: 10px 0 2px; }
.mo-step__sub { font-size: 12.5px; color: var(--text-secondary); line-height: 1.45; margin: 0; }
.mo-step__flag { margin-top: 6px; }
.mo-step.is-todo .mo-step__name { color: var(--text-secondary); font-weight: 600; }
.mo-step.is-done .mo-step__mark { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
.mo-step.is-current .mo-step__mark { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-bg); }
.mo-step.is-current .mo-step__name { color: var(--accent); }
.mo-step.is-returned .mo-step__mark { background: var(--naowee-color-feedback-fill-caution-quiet); border-color: var(--orange-border); color: var(--naowee-color-feedback-text-caution-quiet-on-fill); }
.mo-step.is-halt .mo-step__mark { background: var(--naowee-color-feedback-fill-caution-quiet); border-color: var(--orange-border); color: var(--naowee-color-feedback-text-caution-quiet-on-fill); box-shadow: 0 0 0 4px var(--naowee-color-feedback-fill-caution-quiet); }
.mo-step.is-halt .mo-step__name { color: var(--naowee-color-feedback-text-caution-quiet-on-fill); }
.mo-step.is-end .mo-step__mark { background: var(--naowee-color-feedback-fill-negative-quiet); border-color: var(--red-border); color: var(--naowee-color-feedback-text-negative-quiet-on-fill); box-shadow: 0 0 0 4px var(--naowee-color-feedback-fill-negative-quiet); }
.mo-step.is-end .mo-step__name { color: var(--naowee-color-feedback-text-negative-quiet-on-fill); }
.mo-next {
  display: flex; gap: 10px; align-items: flex-start; margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--border);
  font-size: 13.5px; color: var(--text-primary); line-height: 1.5;
}
.mo-next__lbl { font-weight: 700; flex-shrink: 0; }

/* Columna lateral: lo que puedes hacer y trazabilidad */
.mo-side { padding: 20px; }
.mo-side + .mo-side { margin-top: 0; }
.mo-can { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.mo-can li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; color: var(--text-primary); }
.mo-can__ico { width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 0; }
.mo-can__ico svg { width: 12px; height: 12px; }
.mo-can__ico--no { background: var(--bg-soft); color: var(--text-secondary); }
.mo-can__ico--yes { background: var(--green-bg); color: var(--green); }
.mo-can li.is-no { color: var(--text-secondary); }
.mo-side__foot { font-size: 12.5px; color: var(--text-secondary); margin: 14px 0 0; line-height: 1.5; }
.mo-link { font-weight: 600; }
.mo-trace .od-tl-head { font-size: 13px; }
.mo-trace .od-tl-reason { font-size: 12.5px; color: var(--text-primary); margin-top: 3px; line-height: 1.45; }

/* ═══ 2 · Ficha + Estado y sanciones (Ministerio) ═══ */
.ss-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-areas: "ficha estado"; gap: 20px; align-items: start; }
.ss-estado { grid-area: estado; position: sticky; top: 16px; padding: 0; overflow: hidden; }
.ss-ficha { grid-area: ficha; min-width: 0; }
.ss-sec { padding: 18px 20px; }
.ss-sec + .ss-sec { border-top: 1px solid var(--border); }
.ss-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin: 0 0 12px; }
.ss-now { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ss-now .naowee-badge { height: 24px; padding: 2px 10px; font-size: 12px; }
.ss-now__since { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.ss-now__desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 10px 0 0; }
.ss-estado .mo-reason { margin-top: 14px; }
.ss-actions { display: flex; flex-direction: column; gap: 14px; }
.ss-action { display: flex; flex-direction: column; gap: 6px; }
.ss-action .naowee-btn { width: 100%; }
.ss-action__hint { font-size: 12.5px; color: var(--text-secondary); line-height: 1.45; margin: 0; }
/* Cancelar: acción definitiva, en rojo pero sin peso de primaria */
.ss-btn-danger-quiet { background: var(--naowee-color-feedback-fill-negative-quiet); color: var(--naowee-color-feedback-text-negative-quiet-on-fill); }
.ss-btn-danger-quiet:hover { background: #ffd6dd; }
.ss-btn-danger-quiet:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(218, 22, 48, .22); }
.ss-empty { font-size: 13px; color: var(--text-secondary); margin: 0; }
.ss-hist .od-tl-row:first-child .od-tl-dot { background: var(--accent); }

/* Diálogo de sanción */
.ss-dlg .reg-modal__body { gap: 18px; }
.ss-dlg__lead { font-size: 14px; color: var(--text-primary); line-height: 1.55; margin: 0; }
.ss-conseq { margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 6px; }
.ss-conseq li { font-size: 13.5px; line-height: 1.45; }
.ss-conseq .ss-tag { color: var(--text-secondary); font-size: 12px; }
.bj-select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(215, 64, 9, .15); }
.ss-check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; cursor: pointer; }
.ss-check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex-shrink: 0; }
.ss-check input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ss-dlg .naowee-textfield__input-wrap:focus-within { border-color: var(--accent); }
.ss-dlg .bj-ta-wrap.is-err { border-color: var(--field-border-error); }

/* ── Conmutador de revisión (solo para la revisión del diseño) ── */
.review-switch {
  position: fixed; left: 16px; bottom: 16px; z-index: 65;
  display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px;
  background: #fff; border: 1px dashed var(--border-dark); border-radius: var(--radius-lg);
  box-shadow: 0 4px 14px rgba(40, 40, 52, .12);
}
.review-switch__lbl { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; }
.review-switch .bj-select { width: auto; min-width: 280px; padding: 7px 10px; font-size: 13px; }
.page { padding-bottom: 96px; }

/* ═══ Responsive ═══ */
@media (max-width: 1180px) {
  .mo-grid { grid-template-columns: 1fr; }
  .ss-grid { grid-template-columns: 1fr; grid-template-areas: "estado" "ficha"; }
  .ss-estado { position: static; }
}
@media (max-width: 760px) {
  .mo-org__emoji { width: 38px; height: 38px; font-size: 19px; }
  .mo-task { padding: 18px 16px; }
  .mo-task__title { font-size: 18px; }
  .mo-task__actions .naowee-btn { flex: 1 1 100%; }
  .mo-cycle { padding: 18px 16px; }
  .mo-side { padding: 18px 16px; }
  /* El recorrido pasa a vertical */
  .mo-steps { grid-template-columns: 1fr; gap: 0; }
  .mo-step { display: grid; grid-template-columns: 28px 1fr; column-gap: 12px; padding: 0 0 16px; }
  .mo-step:last-child { padding-bottom: 0; }
  .mo-step__mark { grid-row: 1 / span 3; }
  .mo-step__name { margin: 4px 0 2px; }
  .mo-step:not(:last-child)::after { top: 32px; bottom: 2px; left: 13px; right: auto; width: 2px; height: auto; }
  .mo-next { flex-direction: column; gap: 2px; }
  .ss-sec { padding: 16px; }
  .review-switch { left: 8px; right: 8px; bottom: 8px; padding: 6px 6px 6px 10px; }
  .review-switch .bj-select { flex: 1; min-width: 0; }
  #evToast { bottom: 64px; width: calc(100vw - 32px); }
  .user-chip .user-chip__chevron { display: none; }
  .reg-modal__foot .naowee-btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .mo-task { animation: none; }
}
</style>
</head>
<body>

<div class="shell">
  <div id="sidebarRoot">
    <aside class="sidebar" id="naoweeSidebar">
      <div class="sidebar-logo">
        <button class="burger-btn" id="sidebarToggle" type="button" aria-label="Colapsar menú">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="#282834" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <img src="../../shared/logos/ministerio.svg" alt="Ministerio del Deporte" class="sb-logo-img"/>
        <div class="logo-sep"></div>
        <img src="../../shared/logos/suid.png" alt="SUID" class="sb-logo-img"/>
      </div>
      <nav class="sidebar-nav" id="sidebarNav" role="navigation" aria-label="Menú principal"></nav>
    </aside>
  </div>
  <div class="main">
    <header class="top-header" id="topHeader">
      <button class="header-burger" id="headerBurger" type="button" aria-label="Abrir menú">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>

      <div class="profile-switcher" id="profileSwitcher">
        <div class="user-chip" id="userChipTrigger" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false" aria-label="Mi cuenta">
          <div class="ava">
            <div class="ava-ring" id="chipAva"></div>
            <div class="ava-dot"></div>
          </div>
          <div class="user-info">
            <span class="user-name" id="chipName"></span>
            <span class="user-role" id="chipRole"></span>
          </div>
          <button class="user-chip__chevron" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
        <div class="profile-dd profile-dd--identity-only" role="menu">
          <div class="profile-dd__header">
            <span class="ava-ring" id="ddAva" style="width:42px;height:42px;font-size:14px"></span>
            <div class="profile-dd__user">
              <strong id="ddName"></strong>
              <span class="profile-dd__doc" id="ddDoc"></span>
              <small id="ddMail"></small>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="page">
      <div class="page-inner">
        <div id="viewRoot" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>

<div class="shell-backdrop" id="drawerBackdrop"></div>
<div id="evToast" role="status" aria-live="polite"></div>

<!-- Solo para la revisión del diseño -->
<div class="review-switch" role="group" aria-label="Revisión del diseño">
  <label class="review-switch__lbl" for="reviewSel">Ver como</label>
  <select class="bj-select" id="reviewSel">
    <optgroup label="Administrador del club">
      <option value="adm:Preinscrito">Administrador · Preinscrito</option>
      <option value="adm:En revisión">Administrador · En revisión</option>
      <option value="adm:En corrección" selected>Administrador · En corrección</option>
      <option value="adm:Rechazado">Administrador · Rechazado</option>
      <option value="adm:Suspendido">Administrador · Suspendido</option>
      <option value="adm:Cancelado">Administrador · Cancelado</option>
    </optgroup>
    <optgroup label="Ministerio del Deporte">
      <option value="min:Activo">Ministerio · organismo Activo</option>
      <option value="min:Suspendido">Ministerio · organismo Suspendido</option>
    </optgroup>
  </select>
</div>

<script>

      acciones = `
        <div class="ss-action"><button type="button" class="naowee-btn naowee-btn--loud" data-act="reactivar">Reactivar</button><p class="ss-action__hint">El club vuelve a revisión de la Liga de Patinaje del Valle (propuesta P-08).</p></div>
        <div class="ss-action"><button type="button" class="naowee-btn ss-btn-danger-quiet" data-act="cancelar">${IC.xBig}Cancelar</button><p class="ss-action__hint">Definitivo. El club no vuelve a operar.</p></div>`;
    }
    const reason = minEstado === 'Suspendido' && ultima ? reasonHtml({ label: 'Motivo de la suspensión', text: ultima.motivo, note: ultima.nota, by: MIN_P, fecha: ultima.fecha })
      : minEstado === 'Cancelado' && ultima ? reasonHtml({ label: 'Motivo de la cancelación', text: ultima.motivo, note: ultima.nota, by: MIN_P, fecha: ultima.fecha }) : '';
    const hist = minHist;
    return `
      <div class="ss-sec">
        <h2 class="ss-title" id="ssTitle">Estado y sanciones</h2>
        <div class="ss-now">${badge(minEstado, true)}<span class="ss-now__since">desde el ${esc(minDesde)}</span></div>
        <p class="ss-now__desc">${esc(DESC[minEstado])}</p>
        ${reason}
      </div>
      ${acciones ? `<div class="ss-sec"><div class="ss-actions">${acciones}</div></div>` : ''}
      <div class="ss-sec ss-hist">
        <h3 class="ss-title" style="font-size:14px">Historial de sanciones</h3>
        ${hist.length ? [...hist].reverse().map((h) => `<div class="od-tl-row"><span class="od-tl-dot"></span><div>
            <div class="od-tl-head"><strong>${esc(h.tipo === 'En revisión' ? 'Reactivado' : h.tipo)}</strong></div>
            <div class="od-tl-reason" style="font-size:12.5px;margin-top:2px">${esc(h.motivo)}</div>
            <div class="od-tl-sub">${esc(h.fecha)} · María F. Rojas</div></div></div>`).join('')
          : '<p class="ss-empty">Este club no tiene sanciones registradas.</p>'}
      </div>`;
  }

  function renderMin() {
    document.title = `${ORG.nombre} — Naowee Organismos`;
    root.innerHTML = `
      <nav class="naowee-breadcrumb od-crumbs" aria-label="Ruta jerárquica ascendente">
        <a class="naowee-breadcrumb__item" href="#">Comité Olímpico Colombiano</a><span class="naowee-breadcrumb__sep">${IC.sep}</span>
        <a class="naowee-breadcrumb__item" href="#">Federación Colombiana de Patinaje</a><span class="naowee-breadcrumb__sep">${IC.sep}</span>
        <a class="naowee-breadcrumb__item" href="#">Liga de Patinaje del Valle</a><span class="naowee-breadcrumb__sep">${IC.sep}</span>
        <span class="naowee-breadcrumb__current" aria-current="page">${esc(ORG.nombre)}</span>
      </nav>
      <div class="od-back"><button type="button" class="naowee-btn naowee-btn--mute naowee-btn--small" id="odBack">${IC.back}Volver</button></div>
      <div class="od-hero">
        <div class="od-hero__emoji">🛡️</div>
        <div class="od-hero__main">
          <div class="od-hero__title-row"><h1 class="od-hero__name">${esc(ORG.nombre)}</h1>${badge(minEstado)}</div>
          <p class="od-hero__meta">NIT <b>${esc(ORG.nit)}</b><span class="od-dot">·</span>${esc(ORG.deporte)}<span class="od-dot">·</span>Club escuela<span class="od-dot">·</span>${esc(ORG.ciudad)}, ${esc(ORG.depto)}</p>
        </div>
      </div>
      <div class="ss-grid">
        <aside class="naowee-card ss-estado" aria-labelledby="ssTitle" id="ssPanel">${estadoPanel()}</aside>
        <div class="ss-ficha">
          <div class="naowee-card od-tabs-card">
            <div class="naowee-tabs" role="tablist" aria-label="Secciones de la ficha">
              ${TABS.map((t, i) => `<button type="button" role="tab" id="odt${i}" aria-controls="odPanel" aria-selected="${i === minTab}" tabindex="${i === minTab ? 0 : -1}" class="naowee-tab ${i === minTab ? 'naowee-tab--selected' : ''}" data-tab="${i}">${t}</button>`).join('')}
            </div>
            <div id="odPanel" role="tabpanel" aria-labelledby="odt${minTab}"><div class="od-panel">${tabPanel()}</div></div>
          </div>
        </div>
      </div>`;
    root.querySelector('#odBack').addEventListener('click', () => toast('Volver lleva a la jerarquía.', 'info'));
    root.querySelectorAll('.naowee-breadcrumb__item').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); toast('La ficha de los ancestros queda fuera de esta variante.', 'info'); }));
    const tabs = [...root.querySelectorAll('[data-tab]')];
    tabs.forEach((b) => {
      b.addEventListener('click', () => { minTab = +b.dataset.tab; renderMin(); root.querySelector(`[data-tab="${minTab}"]`).focus(); });
      b.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        minTab = (minTab + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
        renderMin(); root.querySelector(`[data-tab="${minTab}"]`).focus();
      });
    });
    root.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => openSancion(b.dataset.act, b)));
  }

  /* ═══ Diálogo de sanción (patrón openMotivo de la bandeja, con select nativo) ═══ */
  const ACC = {
    suspender: {
      titulo: 'Suspender Club Ruedas del Sur',
      lead: 'La suspensión es temporal. El club conserva sus datos y su historial, y la puedes levantar cuando se resuelva el motivo.',
      msgV: 'caution', msgIc: IC.alert,
      conseq: [
        'Su administradora no podrá aprobar, hacer cargues ni confirmar afiliaciones mientras dure.',
        'Su menú se reduce a «Mi organismo», donde verá el motivo que escribas.',
        'Los organismos que dependen de él no cambian de estado. <span class="ss-tag">Propuesta P-18</span>'
      ],
      motivos: ['Reconocimiento deportivo vencido', 'Incumplimiento de obligaciones de reporte', 'Investigación administrativa en curso', 'Solicitud del ente territorial', 'Otro (explícalo en el detalle)'],
      ok: 'Suspender el club', okCls: 'bj-btn-danger', nuevo: 'Suspendido'
    },
    cancelar: {
      titulo: 'Cancelar Club Ruedas del Sur',
      lead: 'La cancelación es definitiva: el club pierde su reconocimiento en el SUID y no puede volver a estar activo.',
      msgV: 'negative', msgIc: IC.alert,
      conseq: [
        'El club deja de operar de forma permanente. No hay forma de reactivarlo.',
        'Su ficha y su historial quedan disponibles solo para consulta.',
        'Los organismos que dependen de él no cambian de estado. <span class="ss-tag">Propuesta P-18</span>'
      ],
      motivos: ['Pérdida del reconocimiento deportivo', 'Disolución o liquidación de la entidad', 'Decisión judicial o administrativa en firme', 'Otro (explícalo en el detalle)'],
      confirm: 'Entiendo que esta decisión no tiene vuelta atrás.',
      ok: 'Cancelar el club', okCls: 'bj-btn-danger', nuevo: 'Cancelado'
    },
    reactivar: {
      titulo: 'Reactivar Club Ruedas del Sur',
      lead: 'Al reactivarlo, el club no queda activo de inmediato: vuelve a <strong>En revisión</strong> en la bandeja de la <strong>Liga de Patinaje del Valle</strong>, que valida de nuevo los datos que ya tiene.',
      msgV: 'informative', msgIc: IC.info,
      conseq: [
        'La suspensión deja de aplicar y queda en el historial.',
        'La liga decide si lo aprueba o se lo devuelve con un motivo. <span class="ss-tag">Propuesta P-08, pendiente con Negocio</span>',
        'Hasta que la liga lo apruebe, el club sigue sin poder aprobar, cargar ni confirmar afiliaciones.'
      ],
      motivos: ['Se resolvió el motivo de la suspensión', 'Reconocimiento deportivo renovado', 'Cierre de la investigación administrativa', 'Otro (explícalo en el detalle)'],
      ok: 'Reactivar el club', okCls: 'naowee-btn--loud', nuevo: 'En revisión'
    }
  };

  let openDlg = null;
  function openSancion(act, trigger) {
    const a = ACC[act];
    const ov = document.createElement('div');
    ov.className = 'reg-modal-overlay bj-modal-ov';
    ov.innerHTML = `
      <div class="reg-modal bj-modal ss-dlg" role="dialog" aria-modal="true" aria-labelledby="ssDlgT" aria-describedby="ssDlgLead">
        <div class="reg-modal__head"><h3 class="reg-modal__title" id="ssDlgT">${esc(a.titulo)}</h3><button type="button" class="reg-modal__close" id="ssX" aria-label="Cerrar">${IC.xBig}</button></div>
        <div class="reg-modal__body">
          <p class="ss-dlg__lead" id="ssDlgLead">${a.lead}</p>
          <div class="naowee-message naowee-message--${a.msgV}"><span class="naowee-message__icon">${a.msgIc}</span><div class="naowee-message__body"><p class="naowee-message__title" style="font-size:14px">Qué pasa al confirmar</p><ul class="ss-conseq">${a.conseq.map((c) => `<li>${c}</li>`).join('')}</ul></div></div>
          <div class="bj-field">
            <label class="bj-label" for="ssMot">Motivo <span class="bj-req">*</span></label>
            <select class="bj-select" id="ssMot" aria-required="true" aria-describedby="ssMotErr"><option value="">Selecciona un motivo</option>${a.motivos.map((m) => `<option>${esc(m)}</option>`).join('')}</select>
            <p class="bj-err" id="ssMotErr" style="display:none">Selecciona un motivo para continuar.</p>
          </div>
          <div class="bj-field">
            <label class="bj-label" for="ssTxt">Detalle para el organismo <span id="ssTxtReq" class="bj-req" style="display:none">*</span></label>
            <div class="naowee-textfield__input-wrap bj-ta-wrap" id="ssTxtWrap"><textarea id="ssTxt" rows="3" aria-describedby="ssTxtHelp ssTxtErr" placeholder="Lo verá la administradora del club en «Mi organismo»."></textarea></div>
            <p class="naowee-field-help" id="ssTxtHelp">Queda en el historial con tu nombre y la fecha.</p>
            <p class="bj-err" id="ssTxtErr" style="display:none">Explica el motivo cuando eliges «Otro».</p>
          </div>
          ${a.confirm ? `<div class="bj-field"><label class="ss-check"><input type="checkbox" id="ssChk"><span>${esc(a.confirm)}</span></label><p class="bj-err" id="ssChkErr" style="display:none">Confirma que entiendes la consecuencia.</p></div>` : ''}
        </div>
        <div class="reg-modal__foot bj-modal__foot"><button type="button" class="naowee-btn naowee-btn--mute" id="ssBack">Volver</button><button type="button" class="naowee-btn ${a.okCls}" id="ssOk">${esc(a.ok)}</button></div>
      </div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(() => ov.classList.add('is-open'));
    const dlg = ov.querySelector('.reg-modal');
    const sel = ov.querySelector('#ssMot');
    const txt = ov.querySelector('#ssTxt');
    const esOtro = () => sel.value.startsWith('Otro');
    setTimeout(() => sel.focus(), 60);

    const close = () => {
      if (ov.__closing) return; ov.__closing = true;
      ov.classList.remove('is-open'); openDlg = null;
      setTimeout(() => ov.remove(), 340);
      if (trigger && document.body.contains(trigger)) trigger.focus();
    };
    openDlg = close;
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    ov.querySelector('#ssX').addEventListener('click', close);
    ov.querySelector('#ssBack').addEventListener('click', close);
    sel.addEventListener('change', () => {
      sel.classList.remove('bj-select--err'); ov.querySelector('#ssMotErr').style.display = 'none';
      ov.querySelector('#ssTxtReq').style.display = esOtro() ? 'inline' : 'none';
    });
    /* Foco atrapado dentro del diálogo */
    dlg.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const f = [...dlg.querySelectorAll('button, select, textarea, input')].filter((x) => !x.disabled && x.offsetParent !== null);
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    ov.querySelector('#ssOk').addEventListener('click', () => {
      let ok = true, firstBad = null;
      if (!sel.value) { ok = false; sel.classList.add('bj-select--err'); ov.querySelector('#ssMotErr').style.display = 'block'; firstBad = firstBad || sel; }
      const wrap = ov.querySelector('#ssTxtWrap');
      if (esOtro() && !txt.value.trim()) { ok = false; wrap.classList.add('is-err'); ov.querySelector('#ssTxtErr').style.display = 'block'; firstBad = firstBad || txt; }
      else { wrap.classList.remove('is-err'); ov.querySelector('#ssTxtErr').style.display = 'none'; }
      const chk = ov.querySelector('#ssChk');
      if (chk && !chk.checked) { ok = false; ov.querySelector('#ssChkErr').style.display = 'block'; firstBad = firstBad || chk; }
      else if (chk) ov.querySelector('#ssChkErr').style.display = 'none';
      if (!ok) { firstBad.focus(); return; }

      const fecha = '13 oct 2026';
      minHist.push({ tipo: a.nuevo, fecha, motivo: sel.value, nota: txt.value.trim() });
      minEstado = a.nuevo; minDesde = fecha;
      ov.__closing = true; ov.classList.remove('is-open'); openDlg = null;
      setTimeout(() => ov.remove(), 340);
      renderMin();
      const panel = document.getElementById('ssTitle');
      if (panel) { panel.setAttribute('tabindex', '-1'); panel.focus(); }
      const avisos = {
        Suspendido: 'Club Ruedas del Sur quedó <strong>suspendido</strong>. Se notificó a su administradora y a la Liga de Patinaje del Valle.',
        Cancelado: 'Club Ruedas del Sur quedó <strong>cancelado</strong>. Se notificó a su administradora y a la Liga de Patinaje del Valle.',
        'En revisión': 'Club Ruedas del Sur volvió a <strong>En revisión</strong> en la bandeja de la Liga de Patinaje del Valle.'
      };
      toast(avisos[a.nuevo], 'success');
    });
  }

  /* ═══ Render ═══ */
  function render() {
    renderShell();
    if (quien === 'adm') renderAdmin(); else renderMin();
  }

  /* ═══ Snackbar (#evToast canónico) ═══ */
  let tt = null;
  function toast(html, kind) {
    const t = document.getElementById('evToast');
    t.className = `evtoast--${kind || 'info'}`;
    t.innerHTML = `<span class="evtoast__badge" aria-hidden="true">${kind === 'success' ? IC.check : IC.info}</span><span class="evtoast__text">${html}</span>`;
    t.classList.add('is-visible');
    clearTimeout(tt);
    tt = setTimeout(() => t.classList.remove('is-visible'), 3600);
  }

  /* ═══ Chip de identidad ═══ */
  const ps = document.getElementById('profileSwitcher');
  const chip = document.getElementById('userChipTrigger');
  const tgl = (e) => { e.stopPropagation(); const open = ps.classList.toggle('open'); chip.setAttribute('aria-expanded', open); };
  chip.addEventListener('click', tgl);
  chip.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tgl(e); } });
  document.addEventListener('click', (e) => { if (!ps.contains(e.target)) { ps.classList.remove('open'); chip.setAttribute('aria-expanded', 'false'); } });

  /* ═══ Sidebar: colapsar + drawer móvil ═══ */
  const sidebar = document.getElementById('naoweeSidebar');
  document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('collapsed'));
  function closeDrawer() { document.body.classList.remove('has-mobile-drawer-open'); }
  document.getElementById('headerBurger').addEventListener('click', () => document.body.classList.add('has-mobile-drawer-open'));
  document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (openDlg) { openDlg(); return; }
    closeDrawer();
    ps.classList.remove('open');
  });

  /* ═══ Conmutador de revisión ═══ */
  const reviewSel = document.getElementById('reviewSel');
  reviewSel.addEventListener('change', () => {
    const [q, e] = reviewSel.value.split(':');
    if (openDlg) openDlg();
    quien = q;
    if (q === 'adm') estado = e; else resetMin(e);
    render();
    window.scrollTo(0, 0);
  });

  render();
})();
</script>
</body>
</html>
