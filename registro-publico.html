  .ur-btn { height: 40px; min-width: 153px; padding: 0 20px; border-radius: var(--naowee-border-radius-medium); border: 0; background: var(--naowee-color-interactive-fill-loud-idle, var(--ur-accent)); color: var(--naowee-color-text-inverse); font: inherit; font-size: var(--naowee-font-size-14); font-weight: var(--naowee-font-weight-semibold); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; transition: background var(--naowee-transition-default); }
