<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis deportistas — Naowee Organismos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="shared/tokens.css?v=1.3.0">
<link rel="stylesheet" href="shared/shell.css?v=1.3.0">
<link rel="stylesheet" href="shared/components.css?v=1.3.0">
<link rel="stylesheet" href="shared/forms.css?v=1.3.0">
<link rel="stylesheet" href="shared/deportistas.css?v=1.3.0">
<link rel="stylesheet" href="shared/naowee-footer.css?v=1.3.0">
</head>
<body>

<div class="shell">
  <div id="sidebarRoot"></div>
  <div class="main">
    <header class="top-header" id="topHeader"></header>
    <div class="page">
      <div class="page-inner">
        <div class="page-head">
          <h1 class="page-head__title" id="pageTitle">Mis deportistas</h1>
          <p class="page-head__sub" id="pageSub">Plantel con afiliación confirmada a tu club. Consulta la ficha de cada deportista y la cadena que heredó al ser aprobado.</p>
        </div>
        <div id="deportistasRoot"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { getRoleFromQuery, ROLES, getMenuForRole, mountSidebar, mountHeader, mountBackdrop, mountDemoSwitcher } from './shared/sidebar.js';
  import { seedDemoData } from './shared/organismos-data.js';
  seedDemoData();
  const roleCode = getRoleFromQuery();
  const role = ROLES[roleCode];
  /* H1 según la etiqueta del ítem para ese rol (el club lo ve como
     «Mis deportistas»; un rol superior, como su plantel jurisdiccional). */
  getMenuForRole(roleCode).forEach((s) => s.items.forEach((it) => {
    if (it.id === 'deportistas') document.getElementById('pageTitle').textContent = it.label;
  }));
  if (roleCode !== 'CLUB') {
    document.getElementById('pageSub').textContent =
      'Deportistas vinculados a clubes de tu jurisdicción, heredados de la jerarquía. Vista de consulta.';
  }
  mountSidebar({ rootEl: document.getElementById('sidebarRoot'), roleCode, activeId: 'deportistas' });
  mountHeader({ headerEl: document.getElementById('topHeader'), role });
  mountBackdrop();
  mountDemoSwitcher({ roleCode });
  /* El módulo se auto-arranca al importar (render por jurisdicción). */
  import('./shared/deportistas.js?v=1.3.0');
</script>
<script src="shared/naowee-footer.js?v=1.3.0"></script>
<script src="shared/tour.js?v=1.3.0"></script>

</body>
</html>
